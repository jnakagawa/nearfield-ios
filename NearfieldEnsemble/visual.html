<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// §14 interference topography — the phone's main screen. Swift pushes state at
// 5 Hz via nf.update(); this layer smooths per frame and drifts fringes at the
// audible beat rate (nearest coinciding partial pair). Reference: the
// simulator's phone view (spec §14.2 bindings).
'use strict';

function fnv1a(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return h >>> 0;
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (x, lo, hi) => Math.min(Math.max(x, lo), hi);

const FS = `
#extension GL_OES_standard_derivatives : enable
precision highp float;
uniform vec2 res;
uniform float ink, density, breathScale;
uniform vec2 meC[6];
uniform float meLam[6], meW[6];
uniform vec2 peerC[3];
uniform float peerLam[3], peerW[3], peerPhase[3];
float hair(float v, float n, float w) {
  float q = v * n;
  float d = abs(fract(q) - 0.5) / (fwidth(q) + 1e-5);
  return 1.0 - smoothstep(w, w + 1.0, d);
}
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*res) / min(res.x, res.y);
  uv *= breathScale;
  float v = 0.0; float g = 1e-4;
  for (int k = 0; k < 6; k++) {
    v += meW[k] * cos(6.2831853 * length(uv - meC[k]) / meLam[k]);
    g += meW[k];
  }
  for (int j = 0; j < 3; j++) {
    v += peerW[j] * cos(6.2831853 * length(uv - peerC[j]) / peerLam[j] + peerPhase[j]);
    g += peerW[j];
  }
  v = v / g;
  float c = hair(v, density, 0.7);
  float lum = mix(1.0 - c, c, ink);
  gl_FragColor = vec4(vec3(lum), 1.0);
}`;

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: true });
gl.getExtension('OES_standard_derivatives');
function compile(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src); gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
  return sh;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, 'attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }'));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
}
addEventListener('resize', resize);
resize();

const lamFor = f => Math.max(0.32 * Math.pow(220 / f, 0.7), 0.06);
function pairBeatHz(fA, fB, ratios) {
  let best = Infinity;
  for (const ri of ratios) for (const rj of ratios) {
    const d = Math.abs(fA * ri - fB * rj);
    if (d < best) best = d;
  }
  return best < 25 ? best : 0.04;
}

// state from Swift (5 Hz), smoothed per frame
let cfg = null;      // {seedString, ink}
let centers = [];    // 6 seeded off-frame sources
let S = { gains: [1, 0, 0, 0], cents: 0, W: 0, fpAmp: 1, breathPhase: 0,
          pitch: 220, ratios: [1, 2.07, 3.2, 4.4], peers: [] };
let visW = [], visDensity = null, visPeerE = new Map(), beatPhases = new Map();

window.nf = {
  init(c) {
    cfg = c;
    const r = mulberry32(fnv1a(c.seedString));
    centers = Array.from({ length: 6 }, () => {
      const ang = r() * Math.PI * 2, rad = 1.3 + r() * 0.5;
      return { x: Math.cos(ang) * rad, y: Math.sin(ang) * rad,
               wob: r() * Math.PI * 2, rate: 0.03 + r() * 0.04 };
    });
    visW = []; visPeerE = new Map(); beatPhases = new Map(); visDensity = null;
  },
  update(s) { S = s; },
};

const srcSpec = [
  { pk: 0, w: 1.0 }, { pk: 0, w: 0.65 }, { pk: 0, w: 0.45 },
  { pk: 1, w: 1.0 }, { pk: 2, w: 1.0 }, { pk: 3, w: 1.0 },
];

let lastT = null;
function frame(ms) {
  requestAnimationFrame(frame);
  if (!cfg) return;
  const t = ms / 1000;
  const dt = lastT === null ? 0.016 : Math.min(t - lastT, 0.05);
  lastT = t;
  const alpha = tau => 1 - Math.exp(-dt / tau);

  const fMe = S.pitch * Math.pow(2, S.cents / 1200);
  const meC = [], meLam = [], meW = [];
  for (let k = 0; k < 6; k++) {
    const c = centers[k];
    let x = c.x + 0.06 * Math.sin(t * c.rate + c.wob);
    let y = c.y + 0.06 * Math.cos(t * c.rate * 0.9 + c.wob);
    x *= S.fpAmp; y *= S.fpAmp;   // final-gong convergence (§14.1)
    meC.push(x, y);
    const spec = srcSpec[k];
    meLam.push(lamFor(S.pitch * S.ratios[spec.pk]));
    const target = (S.gains[spec.pk] ?? 0) * spec.w;
    visW[k] = (visW[k] ?? 0) + (target - (visW[k] ?? 0)) * alpha(0.2);
    meW.push(visW[k]);
  }

  const peerC = [], peerLam = [], peerW = [], peerPhase = [];
  for (let j = 0; j < 3; j++) {
    const p = S.peers[j];
    if (p) {
      const eKey = p.id;
      visPeerE.set(eKey, (visPeerE.get(eKey) ?? 0) + (p.e - (visPeerE.get(eKey) ?? 0)) * alpha(0.3));
      const e = visPeerE.get(eKey);
      const ang = (fnv1a(`${p.id}|azimuth`) % 6283) / 1000;
      const rad = 1.9 - 0.7 * e;
      peerC.push(Math.cos(ang) * rad, Math.sin(ang) * rad);
      peerLam.push(lamFor(p.freq));
      peerW.push(e);
      const beat = 1.2 * Math.tanh(pairBeatHz(fMe, p.freq, S.ratios) / 1.2);
      const ph = (beatPhases.get(p.id) ?? 0) + 2 * Math.PI * beat * dt;
      beatPhases.set(p.id, ph);
      peerPhase.push(ph);
    } else { peerC.push(9, 9); peerLam.push(1); peerW.push(0); peerPhase.push(0); }
  }

  const densTarget = 2 + 2 * S.W;
  visDensity = visDensity === null ? densTarget : visDensity + (densTarget - visDensity) * alpha(0.5);

  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(prog);
  const loc = n => gl.getUniformLocation(prog, n);
  gl.uniform2f(loc('res'), canvas.width, canvas.height);
  gl.uniform1f(loc('ink'), cfg.ink ?? 1);
  gl.uniform1f(loc('density'), visDensity);
  gl.uniform1f(loc('breathScale'), 1 + 0.02 * Math.sin(S.breathPhase));
  gl.uniform2fv(loc('meC'), meC);
  gl.uniform1fv(loc('meLam'), meLam);
  gl.uniform1fv(loc('meW'), meW);
  gl.uniform2fv(loc('peerC'), peerC);
  gl.uniform1fv(loc('peerLam'), peerLam);
  gl.uniform1fv(loc('peerW'), peerW);
  gl.uniform1fv(loc('peerPhase'), peerPhase);
  const pAttr = gl.getAttribLocation(prog, 'p');
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.enableVertexAttribArray(pAttr);
  gl.vertexAttribPointer(pAttr, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
