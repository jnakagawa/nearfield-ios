<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nearfield — visual identity sketches</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: #fff; }
  body { font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #stage { position: fixed; inset: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #bar {
    position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 6px;
    padding: 10px; z-index: 10; justify-content: center; align-items: center;
  }
  #bar button {
    border: 1px solid #111; background: transparent; color: #111;
    padding: 6px 12px; border-radius: 999px; font-size: 12px; letter-spacing: 0.06em;
    cursor: pointer;
  }
  #bar button.active { background: #111; color: #fff; }
  #caption {
    position: fixed; bottom: 14px; left: 0; right: 0; text-align: center;
    color: #111; z-index: 10; letter-spacing: 0.08em; font-size: 11px;
    text-transform: uppercase;
  }
  body.dark { background: #000; }
  body.dark #bar button { border-color: #eee; color: #eee; }
  body.dark #bar button.active { background: #eee; color: #000; }
  body.dark #caption { color: #eee; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="c2d"></canvas>
</div>
<div id="bar">
  <button data-mode="A" class="active">A rings</button>
  <button data-mode="B">B dots</button>
  <button data-mode="C">C lines</button>
  <button data-mode="D">D terrain</button>
  <button id="invert">◐</button>
</div>
<div id="caption">—</div>

<script>
'use strict';
// ============================================================================
// Visual identity sketches. A fake encounter loops forever:
// solo → approach (fast beat) → locked (fringes freeze) → parting.
// Everything is driven by the same quantities the real app will have:
// pitch + partial gains, encounter envelope E, beat rate, fingerprint seed.
// ============================================================================

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20260705);
const FP = { ox: rng() * 0.3 - 0.15, oy: rng() * 0.3 - 0.15, rot: rng() * Math.PI };

const RATIOS = [1.0, 2.07, 3.2, 4.4];
const AMPS = [1.0, 0.5, 0.3, 0.2];

// --- the encounter story (25 s loop) ----------------------------------------
// returns {E, beatHz, label} — E is the encounter envelope, beatHz the visual
// beat rate (fast while approaching, ~0 when locked, per the resolution slew)
function story(t) {
  const T = t % 26;
  if (T < 5)  return { E: 0, beatHz: 0, label: 'solo' };
  if (T < 13) { const u = (T - 5) / 8;  return { E: u, beatHz: 2.2 * (1 - u) + 0.15, label: 'approaching' }; }
  if (T < 20) return { E: 1, beatHz: 0.06, label: 'locked' };
  { const u = (T - 20) / 6; return { E: 1 - u, beatHz: 0.15 + 1.2 * u, label: 'parting' }; }
}

let mode = 'A';
let dark = false;
const glCanvas = document.getElementById('gl');
const c2dCanvas = document.getElementById('c2d');
const ctx2d = c2dCanvas.getContext('2d');
const gl = glCanvas.getContext('webgl', { antialias: true });
gl.getExtension('OES_standard_derivatives'); // enables fwidth() in GLSL ES 1.0

// --- WebGL scaffolding --------------------------------------------------------

const VS = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;

const COMMON = `
#extension GL_OES_standard_derivatives : enable
precision highp float;
uniform vec2 res;
uniform float t, E, beatPhase, ink;   // ink: 0 = black-on-white, 1 = white-on-black
uniform vec2 fpOff;
uniform float fpRot;
float hair(float v, float n, float w) {
  // constant-width contour hairlines: distance to iso level in screen pixels
  float q = v * n;
  float d = abs(fract(q) - 0.5) / (fwidth(q) + 1e-5);
  return 1.0 - smoothstep(w, w + 1.0, d);
}
vec2 rot(vec2 p, float a){ float c=cos(a), s=sin(a); return vec2(c*p.x-s*p.y, s*p.x+c*p.y); }
`;

// A — interference topography: two ring families, contoured sum
const FS_A = COMMON + `
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*res) / min(res.x, res.y);
  vec2 me = fpOff;
  vec2 peer = mix(vec2(1.25, 0.9), vec2(0.22, 0.16), E);   // drifts in as E rises
  float v = 0.0; float g = 0.0;
  for (int k = 0; k < 3; k++) {
    float ratio = k==0?1.0: k==1?2.07: 3.2;
    float amp   = k==0?1.0: k==1?0.5:  0.3;
    float lam = 0.17 / ratio;
    v += amp * cos(6.2831853 * length(uv - me) / lam);
    g += amp;
    if (k < 2) { // peer shows two partials
      float lamP = lam * (1.0 + 0.013 * (1.0 - E));        // detune -> spacing offset
      v += E * amp * cos(6.2831853 * length(uv - peer) / lamP + beatPhase);
      g += E * amp;
    }
  }
  v = v / g;
  float c = hair(v, 4.0, 0.7);
  float lum = mix(1.0 - c, c, ink);
  gl_FragColor = vec4(vec3(lum), 1.0);
}`;

// B — halftone dot moiré: two rotated dot screens
const FS_B = COMMON + `
float screenDots(vec2 uv, float ang, float spacing, float sz){
  vec2 q = rot(uv, ang) / spacing;
  vec2 f = fract(q) - 0.5;
  return smoothstep(sz, sz - 0.09, length(f));
}
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*res) / min(res.x, res.y);
  uv = rot(uv, fpRot * 0.3);
  float s = 0.017;
  float d1 = screenDots(uv, 0.26, s, 0.24);
  float d2 = screenDots(uv, 0.26 + 0.06 + beatPhase*0.012, s * (1.0 + 0.02*(1.0-E)), 0.24);
  float c = max(d1, E * d2);   // overlap prints darker structure = moiré
  float lum = mix(1.0 - c, c, ink);
  gl_FragColor = vec4(vec3(lum), 1.0);
}`;

// D — state terrain: contoured hills (wind, bloom, encounter)
const FS_D = COMMON + `
float hill(vec2 uv, vec2 c, float r){ float d = length(uv - c); return exp(-d*d/(r*r)); }
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*res) / min(res.x, res.y);
  uv = rot(uv, fpRot);
  float breath = 0.5 + 0.5 * sin(t * 0.35);
  float v = 0.0;
  v += 0.9 * hill(uv, fpOff, 0.42 + 0.06 * breath);                        // me
  v += 0.5 * hill(uv, fpOff + vec2(0.18, -0.24), 0.23 + 0.05*sin(t*0.5));  // wind lobe
  vec2 peer = mix(vec2(0.9, 0.75), vec2(0.2, 0.12), E);
  v += E * 0.85 * hill(uv, peer, 0.3 + 0.02 * sin(beatPhase));             // encounter
  v += 0.04 * sin(uv.x * 9.0 + t * 0.2) * sin(uv.y * 8.0 - t * 0.13);      // slow ground
  float c = hair(v, 14.0, 0.7);
  float lum = mix(1.0 - c, c, ink);
  gl_FragColor = vec4(vec3(lum), 1.0);
}`;

function makeProgram(fsSrc) {
  const compile = (type, src) => {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
  };
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  return prog;
}

const programs = { A: makeProgram(FS_A), B: makeProgram(FS_B), D: makeProgram(FS_D) };
const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);

function drawGL(prog, t, st, beatPhase) {
  gl.viewport(0, 0, glCanvas.width, glCanvas.height);
  gl.useProgram(prog);
  const loc = n => gl.getUniformLocation(prog, n);
  gl.uniform2f(loc('res'), glCanvas.width, glCanvas.height);
  gl.uniform1f(loc('t'), t);
  gl.uniform1f(loc('E'), st.E);
  gl.uniform1f(loc('beatPhase'), beatPhase);
  gl.uniform1f(loc('ink'), dark ? 1 : 0);
  gl.uniform2f(loc('fpOff'), FP.ox, FP.oy);
  gl.uniform1f(loc('fpRot'), FP.rot);
  const p = gl.getAttribLocation(prog, 'p');
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.enableVertexAttribArray(p);
  gl.vertexAttribPointer(p, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// C — displaced line field (canvas 2d)
function drawC(t, st, beatPhase) {
  const w = c2dCanvas.width, h = c2dCanvas.height;
  const dpr = window.devicePixelRatio || 1;
  ctx2d.setTransform(1, 0, 0, 1, 0, 0);
  ctx2d.fillStyle = dark ? '#000' : '#fff';
  ctx2d.fillRect(0, 0, w, h);
  ctx2d.strokeStyle = dark ? '#eee' : '#111';
  ctx2d.lineWidth = 1 * dpr;
  const rows = 72, seg = 160;
  const margin = h * 0.12;
  for (let r = 0; r < rows; r++) {
    const y0 = margin + (h - 2 * margin) * r / (rows - 1);
    const rowPhase = r * 0.35 + FP.rot;
    ctx2d.beginPath();
    for (let sgi = 0; sgi <= seg; sgi++) {
      const x = (w * sgi) / seg;
      const u = sgi / seg;
      let disp = 0;
      for (let k = 0; k < 3; k++) {
        const fSpat = 3.0 * RATIOS[k];
        disp += AMPS[k] * Math.sin(2 * Math.PI * fSpat * u + rowPhase + t * (0.4 + 0.13 * k));
      }
      // peer tone slightly detuned: spatial beat envelope rolls through
      disp += st.E * 0.9 * Math.sin(2 * Math.PI * 3.0 * 1.02 * u + rowPhase + t * 0.4 + beatPhase);
      const env = Math.exp(-Math.pow((u - 0.5) / 0.36, 2)); // centered energy
      const y = y0 + disp * env * (h / rows) * 0.85;
      sgi === 0 ? ctx2d.moveTo(x, y) : ctx2d.lineTo(x, y);
    }
    ctx2d.stroke();
  }
}

// --- main loop -----------------------------------------------------------------

let beatPhase = 0, lastT = null;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  for (const c of [glCanvas, c2dCanvas]) {
    c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  }
}
addEventListener('resize', resize);
resize();

function frame(ms) {
  requestAnimationFrame(frame);
  const t = ms / 1000;
  if (lastT === null) lastT = t;
  const dt = Math.min(t - lastT, 0.05);
  lastT = t;
  const st = story(t);
  beatPhase += 2 * Math.PI * st.beatHz * dt;   // fringes drift at the beat rate
  glCanvas.style.display = mode === 'C' ? 'none' : 'block';
  c2dCanvas.style.display = mode === 'C' ? 'block' : 'none';
  if (mode === 'C') drawC(t, st, beatPhase);
  else drawGL(programs[mode], t, st, beatPhase);
  document.getElementById('caption').textContent =
    `${st.label}${st.E > 0 ? ` · beat ${st.beatHz.toFixed(1)} Hz` : ''}`;
}
requestAnimationFrame(frame);

// --- controls --------------------------------------------------------------------

for (const b of document.querySelectorAll('#bar button[data-mode]')) {
  b.onclick = () => {
    mode = b.dataset.mode;
    document.querySelectorAll('#bar button[data-mode]').forEach(x => x.classList.toggle('active', x === b));
  };
}
document.getElementById('invert').onclick = () => {
  dark = !dark;
  document.body.classList.toggle('dark', dark);
};
</script>
</body>
</html>
