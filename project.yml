name: Nearfield
options:
  bundleIdPrefix: com.nearfield
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    DEVELOPMENT_TEAM: "34TC8WMBSQ"
    CODE_SIGN_STYLE: Automatic

schemes:
  NearfieldEnsemble:
    build:
      targets:
        NearfieldEnsemble: all
    test:
      targets:
        - NearfieldEnsembleTests

targets:
  NearfieldEnsemble:
    type: application
    platform: iOS
    sources:
      - path: NearfieldEnsemble
      # bundled configs: the §8 solo fallback sings without any hub
      - path: config/scale.json
        buildPhase: resources
      - path: config/params.json
        buildPhase: resources
    settings:
      base:
        # TestFlight ships under the pre-existing ASC app record ("Nearfield
        # Sonic") — the ASC API cannot create new app records headless. The
        # v1 duet target moved to com.nearfield.duet.
        PRODUCT_BUNDLE_IDENTIFIER: com.nearfield.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 37
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: true
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_CFBundleDisplayName: Nearfield
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: NearfieldEnsemble/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: "Connects to the Nearfield hub on the local network to receive this phone's part in the ensemble."
        # The hub speaks cleartext ws:// on a private network (LAN or tailnet).
        # NSAllowsArbitraryLoads ONLY — do not add NSAllowsLocalNetworking:
        # its presence makes iOS ignore NSAllowsArbitraryLoads (documented),
        # and tailnet 100.x addresses are not "local" to ATS.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Bluetooth (Dance phase: BLE encounter sensing)
        NSBluetoothAlwaysUsageDescription: "Bluetooth senses which other participants are near you; closeness shapes the sound."
        NSBluetoothPeripheralUsageDescription: "Bluetooth senses which other participants are near you; closeness shapes the sound."
        UIBackgroundModes:
          - audio
        # ws/wss only; standard crypto — skips the export-compliance question
        ITSAppUsesNonExemptEncryption: false

  NearfieldEnsembleTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    sources:
      - path: NearfieldEnsembleTests
      - path: config/scale.json
        buildPhase: resources
      - path: config/score.json
        buildPhase: resources
      - path: config/scale_drift.json
        buildPhase: resources
      - path: config/params.json
        buildPhase: resources
      - path: config/fixtures/reward_golden.json
        buildPhase: resources
    dependencies:
      - target: NearfieldEnsemble

  Nearfield:
    type: application
    platform: iOS
    sources:
      - path: Nearfield/Nearfield
        excludes:
          - "*.plist"
    settings:
      base:
        INFOPLIST_FILE: Nearfield/Nearfield/Info.plist
        # com.nearfield.app now belongs to the ensemble beta (see above)
        PRODUCT_BUNDLE_IDENTIFIER: com.nearfield.duet
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: true
    info:
      path: Nearfield/Nearfield/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Nearby Interaction (UWB)
        NSNearbyInteractionAllowOnceUsageDescription: "This app uses Nearby Interaction to detect the distance to other phones for the sound installation."
        NSNearbyInteractionUsageDescription: "This app uses Nearby Interaction to detect the distance to other phones for the sound installation."
        # Multipeer Connectivity
        NSLocalNetworkUsageDescription: "This app uses local network to find other Nearfield devices nearby."
        NSBonjourServices:
          - "_nearfield._tcp"
          - "_nearfield._udp"
        # Bluetooth
        NSBluetoothAlwaysUsageDescription: "Bluetooth is used to discover nearby devices for the sound installation."
        NSBluetoothPeripheralUsageDescription: "Bluetooth is used to discover nearby devices for the sound installation."
        # Background Modes
        UIBackgroundModes:
          - audio
          - nearby-interaction
